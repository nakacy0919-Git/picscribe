name: PicScribe Development Checks

on:
  push:
    branches:
      - feature/picscribe-coach-eiken-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PicScribe test suite (no external services)
        run: node --test tests/*.test.cjs
